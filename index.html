<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bianchi Dessert</title>
  <meta name="description" content="Bianchi Dessert : tiramisù, cheesecakes, cookies, beignets et glaces artisanales. Stock du jour en direct, commande en 2 minutes via WhatsApp.">
  <meta name="theme-color" content="#f8f3ea">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Bianchi Dessert — la vitrine du jour">
  <meta property="og:description" content="Tiramisù, cheesecakes, cookies, beignets et glaces artisanales à Tétouan. Stock du jour en direct, commande en 2 minutes via WhatsApp, paiement à la réception.">
  <meta property="og:image" content="https://bianchidessert.com/assets/og.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
  <script>try{var th=localStorage.getItem("bianchi_theme");if(th==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}</script>
  <link rel="stylesheet" href="css/base.css?v=31">
  <link rel="stylesheet" href="css/site.css?v=31">
</head>
<body>

  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#top" aria-label="Bianchi Dessert"><img src="assets/logo.png" alt=""><span><b>BIANCHI</b><small>Dessert</small></span></a>
      <div class="search-wrap topbar-search">
        <label class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="recherche" data-i18n-placeholder="search_placeholder" placeholder="Rechercher un dessert…" autocomplete="off">
          <button type="button" class="filter-btn" data-filter-toggle aria-label="Filtres" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="fcount" hidden></span></button>
        </label>
        <div class="filter-pop" data-filter-pop hidden></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn mob" id="searchToggle" aria-label="Rechercher"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
        <a class="icon-btn mob" id="btnWaTop" target="_blank" rel="noopener" aria-label="WhatsApp"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.2 8L3 21l1.1-4.6A9 9 0 1 1 21 12Z"/></svg></a>
        <span class="topbar-status"><span class="status-dot" id="dotDesk"></span><span id="statusDesk">—</span></span>
        <a class="btn btn-outline-gold btn-sm topbar-wa" id="btnWaDesk" target="_blank" rel="noopener" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 1-13.2 8L3 21l1.1-4.6A9 9 0 1 1 21 12Z"/></svg><span data-i18n="whatsapp">WhatsApp</span>
        </a>
        <button type="button" class="icon-btn theme-btn" data-theme-toggle aria-label="Mode sombre"><svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <label class="lang-switch"><span class="sr-only" data-i18n="language">Langue</span><select id="langSelect" aria-label="Langue"></select></label>
      </div>
    </div>
  </header>

  <div class="closed-banner" id="closedBanner" hidden><span class="ic">🌙</span><div><b data-i18n="closed_title">Rideau baissé, commandes fermées</b><span id="closedMsg"></span></div></div>
  <div class="pending-banner" id="pendingBanner" hidden></div>

  <div class="layout" id="top">
    <aside class="col-brand" id="hero">
      <div class="hero-tools mob"><button type="button" class="icon-btn theme-btn" data-theme-toggle aria-label="Mode sombre"><svg class="ic-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="ic-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><label class="lang-switch hero-lang"><span class="sr-only" data-i18n="language">Langue</span><select id="langSelectHero" aria-label="Langue"></select></label></div>
      <img class="logo" src="assets/logo.png" alt="Logo Bianchi Dessert" width="200" height="200">
      <div class="brand-text">
        <p class="slogan" id="slogan">Per l'amor del gusto</p>
        <div class="tagline" id="tagline"></div>
      </div>
      <div class="head-day desk">
        <div class="eyebrow" id="dateDesk"></div>
        <h1><span data-i18n="showcase_a">La vitrine</span><br><em data-i18n="showcase_b">du jour</em></h1>
      </div>
      <p class="intro desk" data-i18n="intro"></p>
      <ul class="infos-list desk" id="infosDesk"></ul>
    </aside>
    <div class="search-reveal mob" id="searchReveal">
      <div class="search-wrap">
        <label class="search">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="rechercheMob" data-i18n-placeholder="search_placeholder" placeholder="Rechercher un dessert…" autocomplete="off">
          <button type="button" class="filter-btn" data-filter-toggle aria-label="Filtres" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg><span class="fcount" hidden></span></button>
        </label>
        <div class="filter-pop" data-filter-pop hidden></div>
      </div>
    </div>

    <main class="col-main">
      <div class="bannieres" id="bannieres"></div>
      <div class="head-day mob">
        <div>
          <div class="eyebrow" id="dateMob"></div>
          <h1><span data-i18n="showcase_a">La vitrine</span> <em data-i18n="showcase_b">du jour</em></h1>
        </div>
        <div class="count" id="countMob"></div>
      </div>
      <nav class="catnav" id="catnav" aria-label="Catégories"></nav>
      <div id="catalogue"></div>
      <div class="foot-info">
        <p class="intro mob" data-i18n="intro"></p>
        <p class="reassure" id="reassure"></p>
        <ul id="footInfo"></ul>
      </div>
      <div class="credit">Made with <em>tawakkul</em> by <a href="https://wa.me/33649889754" target="_blank" rel="noopener">HJR Consulting</a></div>
    </main>
  </div>

  <button class="cart-fab hidden" id="cartFab">
    <span class="left"><span class="count" id="cartCount">0</span><span data-i18n="view_cart">Voir le panier</span></span>
    <span class="total num" id="cartFabTotal"></span>
  </button>

  <div class="overlay" id="overlay"></div>

  <aside class="drawer" id="drawer" aria-label="Mon panier">
    <div class="drawer-head">
      <div class="t"><div class="eyebrow" id="shopName">Bianchi Dessert</div><h2 id="cartTitle" data-i18n="cart_title">Mon panier</h2></div>
      <div style="display:flex;align-items:center;gap:8px"><span class="n" id="cartN"></span><button class="close" id="closeDrawer" aria-label="Fermer">×</button></div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <div class="modal" id="modal">
    <div class="modal-card" id="modalCard"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/i18n.js?v=31"></script>
  <script src="js/catalogue-traductions.js"></script>
  <script src="js/demo-data.js?v=31"></script>
  <script src="js/data.js?v=31"></script>
  <script src="js/site.js?v=31"></script>
</body>
</html>
